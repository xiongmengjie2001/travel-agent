[project]
name = "travel-agent2"
version = "0.1.0"
description = "基于 OODA 决策循环的旅行规划智能体"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

# ---------------------------------------------------------------- pytest
# pythonpath 让 `from src.models import ...` 在 `pytest tests/ -v` 下可解析，
# 无需把项目安装成包。
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
# 全链路异步后，测试直接写 `async def test_*` 即可，无需逐个加 marker。
asyncio_mode = "auto"

# -------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src", "api"]
omit = ["*/tests/*", "*/__init__.py"]

# 对应 CLAUDE.md：整体 ≥ 80%
[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
